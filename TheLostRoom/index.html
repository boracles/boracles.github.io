<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>안개 아이 · The Lost Room 2</title>
<meta name="description" content="QR 위에 나타난 안개 아이를 누른 채 잃어버린 이야기를 털어놓아 주세요. 손을 떼면 그 이야기가 음악이 됩니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%232b4fe0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261028-finish-1">
</head>
<body>
<video id="camera-feed" playsinline muted autoplay></video>
<canvas id="stage"></canvas>

<div id="ui">
  <!-- Takes touches for holding the child -->
  <div id="touch" role="button" tabindex="0" aria-label="안개 아이를 누른 채 이야기하기"></div>
  <div id="child-cue" aria-hidden="true" hidden></div>
  <div id="scan-guide" aria-hidden="true" hidden><span></span></div>

  <!-- Permission/loading screen; the camera opens automatically on entry. -->
  <section id="intro">
    <div class="intro-inner">
      <div class="eyebrow">The Lost Room 2</div>
      <h1 data-i18n="title">안개 아이</h1>
      <p class="lede" data-i18n="introduction"></p>
      <button id="start" class="tap" type="button" data-i18n="loading" disabled>준비하는 중…</button>
      <div id="load-status" aria-live="polite"></div>
      <p class="fine" data-i18n="privacy"></p>
    </div>
  </section>

  <section id="hud">
    <div id="marker-status" role="status" aria-live="polite"></div>
    <div id="rec" role="status" aria-live="polite"><i class="dot"></i><span class="label" data-i18n="listening">듣고 있어요</span><span class="time" aria-hidden="true">0:00</span></div>
    <div id="caption" role="status" aria-live="polite"><div class="ko"></div><div class="hint"></div><progress id="music-progress" max="1" value="0" aria-label="음악 생성" hidden></progress></div>
  </section>
  <section id="resume" hidden>
    <div class="resume-inner"><p id="resume-text"></p><button id="resume-button" class="tap" type="button"></button></div>
  </section>
</div>

<!-- Pin the renderer and glTF loader to the same version. -->
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.31.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.31.0/babylonjs.loaders.min.js"></script>
<script src="assets/vendor/jsQR.js"></script>
<script type="module" src="app.js?v=20261028-finish-1"></script>
<script>
// Keep an actionable screen when the renderer or module cannot load.
window.addEventListener('error',function(event){
  if(!event.filename&&!event.target?.src)return;
  if(!document.body.classList.contains('mode-camera')&&!document.body.classList.contains('mode-3d')){
    var button=document.getElementById('start');
    button.disabled=false;button.textContent='다시 열기 / Retry';
    button.onclick=function(){location.reload();};
    document.getElementById('load-status').textContent='연결을 확인하고 다시 열어 주세요. / Check your connection and retry.';
  }
},true);
</script>
</body>
</html>
