<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>안개 아이 · The Lost Room 2</title>
<meta name="description" content="QR 위의 안개 아이를 누른 채 이야기해 주세요. 손을 떼면 그 소리에서 음악이 만들어집니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%232b4fe0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261026-hold-voice-spatial-1">
</head>
<body>
<video id="camera-feed" playsinline muted autoplay></video>
<canvas id="stage"></canvas>

<div id="ui">
  <!-- Takes touches for placing and playing; also inside the WebXR DOM overlay -->
  <div id="touch" role="button" tabindex="0" aria-label="안개 아이를 누른 채 이야기하기"></div>
  <section id="intro">
    <select id="intro-language" class="language-picker" aria-label="언어"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select>
    <div class="intro-inner">
      <div class="eyebrow">The Lost Room 2</div>
      <h1 data-i18n="title">안개 아이</h1>
      <p class="lede" data-i18n="introduction"></p>
      <button id="start" class="btn btn-primary" data-i18n="loading" disabled>준비하는 중…</button>
      <div id="load-status" aria-live="polite"></div>
      <p class="fine" data-i18n="privacy"></p>
    </div>
  </section>

  <section id="hud">
    <div class="topbar">
      <span class="brand">The Lost Room 2</span>
      <span class="spacer"></span>
      <select id="language" class="language-picker" aria-label="언어"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select>
      <button class="icon-btn" id="btn-sound" aria-label="소리 끄기" title="소리">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path id="snd-wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
      <button class="icon-btn" id="btn-exit" aria-label="마치기" title="마치기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div id="marker-status" role="status" aria-live="polite"></div>

    <div id="rec" role="status" aria-live="polite"><i class="dot"></i><span class="label" data-i18n="listening">듣고 있어요</span><span class="time" aria-hidden="true">0:00</span></div>

    <div id="caption"><div class="ko"></div><div class="hint"></div></div>
  </section>

  <section class="sheet" id="end">
    <div class="end-inner">
      <div class="eyebrow">The Lost Room 2</div>
      <p class="end-main" data-i18n="endTitle"></p>
      <p class="fine" data-i18n="endNote"></p>
      <button class="btn btn-ghost" id="again" data-i18n="again">처음으로</button>
    </div>
  </section>
</div>

<!-- Pin the renderer and glTF loader to the same version. -->
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.31.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.31.0/babylonjs.loaders.min.js"></script>
<script src="assets/vendor/jsQR.js"></script>
<script type="module" src="app.js?v=20261026-hold-voice-spatial-1"></script>
</body>
</html>
